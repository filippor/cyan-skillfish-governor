[package]
name = "cyan-skillfish-governor-smu"
version = "0.4.0"
license = "MIT"
edition = "2024"
build = "build.rs"

[dependencies]
libdrm_amdgpu_sys = "*"
toml = "*"
nix = { version="*",features = ["fs"] }
thiserror = "*"
signal-hook = {version="*",  features = ["iterator"] }
clap = { version="*", features = ["derive"] }
clap-verbosity-flag = "*"
env_logger = "*"
log = "*"
zbus = {version="*",  features = ["blocking"] }
