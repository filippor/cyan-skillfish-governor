# us
[timing.intervals]
sample = 250
adjust = 100_000

[gpu-usage]
fix-metrics = false
 fix-freq = false
method = "busy-flag" # "busy-flag" , "process" or "kernel"
flush-every = 10

[gpu]
set-method = "smu"  # "smu" or "kernel"

# Profiles: 1 = ~450 MHz idle, 3 = ~1750 MHz active/baseline.
# Profile 2 is avoided because it may be unstable on BC-250.
# CPU DRAM bandwidth and GPU load are combined as effective memory demand.
# Profile decisions use an EWMA with a 500 ms half-life to filter short spikes.
# System-wide PMU access requires root/CAP_PERFMON.
[memory-fabric-profile]
# Experimental: queue 3 message 0x1E is not fully understood and has caused
# hardware resets on BC-250 systems. Enable only for controlled testing.
enabled = true
# Switch 1 -> 3 above 4.25 GiB/s and 3 -> 1 below 1.75 GiB/s. The wide
# hysteresis band prevents rapid profile changes.
lower-utilization = 0.40
upper-utilization = 0.80
bandwidth-scale-gib = 1.0

[dbus]
enabled = true


# Optional: set initial frequency range limits
# Both min and max can be omitted or set to 0 for no limit
[frequency-range]
min = 1000    # MHz
max = 1500   # MHz

# MHz/ms
[timing.ramp-rates]
normal = 1
burst = 50

# number of samples
[timing]
burst-samples = 60
down-events = 5

# MHz
[frequency-thresholds]
adjust = 10

# %
[load-target]
upper = 0.65
lower = 0.50

#°C
[temperature]
throttling = 85
throttling_recovery = 75

[[safe-points]]
frequency = 500
voltage = 700

[[safe-points]]
frequency = 1000
voltage = 800

[[safe-points]]
frequency = 1175
voltage = 850

[[safe-points]]
frequency = 1500
voltage = 900

