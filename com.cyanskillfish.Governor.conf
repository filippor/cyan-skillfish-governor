<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.cyanskillfish.Governor"/>
    <allow own="com.cyan.SkillFishGovernor"/>
    <allow send_destination="com.cyanskillfish.Governor"/>
    <allow send_destination="com.cyan.SkillFishGovernor"/>
    <allow receive_sender="com.cyanskillfish.Governor"/>
    <allow receive_sender="com.cyan.SkillFishGovernor"/>
  </policy>

  <!-- Performance Mode: Allow all authenticated users -->
  <policy context="default">
    <allow send_destination="com.cyanskillfish.Governor"/>
    <allow send_destination="com.cyan.SkillFishGovernor"/>
    <allow send_interface="com.cyanskillfish.Governor.PerformanceMode"/>
    <allow send_interface="com.cyan.SkillFishGovernor.PerformanceMode"/>
    <allow send_interface="org.freedesktop.DBus.Properties"/>
  </policy>

  <!-- Test Mode: Root only (requires explicit authorization) -->
  <policy user="root">
    <allow send_interface="com.cyanskillfish.Governor.TestMode"/>
  </policy>
  <policy context="default">
    <deny send_interface="com.cyanskillfish.Governor.TestMode"/>
  </policy>
</busconfig>